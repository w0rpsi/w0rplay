<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Card: Deep titanium carbon dark gradient -->
    <linearGradient id="w0r_bg" x1="0" y1="48" x2="0" y2="975" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#282c34"/>
      <stop offset="50%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>

    <!-- Bevel rim glow -->
    <linearGradient id="w0r_rim" x1="0" y1="48" x2="0" y2="975" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8a99ad"/>
      <stop offset="40%" stop-color="#4b5563"/>
      <stop offset="80%" stop-color="#2d333b"/>
      <stop offset="100%" stop-color="#15181c"/>
    </linearGradient>

    <!-- Cyber Neon Gradient for W0R (Electric Emerald to Cyan) -->
    <linearGradient id="w0r_neon" x1="180" y1="300" x2="844" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="45%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Glowing accent gradient -->
    <linearGradient id="w0r_core" x1="0" y1="360" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F7FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Drop Shadow / Glow filter -->
    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="rimFade" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Base Squircle Card Background (iOS/CarPlay style) -->
  <rect x="52" y="52" width="920" height="920" rx="224" ry="224" fill="url(#w0r_bg)" stroke="url(#w0r_rim)" stroke-width="12"/>

  <!-- Inner subtle cockpit rim -->
  <rect x="68" y="68" width="888" height="888" rx="208" ry="208" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>

  <!-- Glowing background ambient light behind the logo -->
  <circle cx="512" cy="512" r="260" fill="#00E5FF" opacity="0.08" filter="blur(60px)"/>

  <!-- Shadow under the W -->
  <polyline points="230,340 370,710 512,500 654,710 794,340" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="104" stroke="#04121a" opacity="0.7" transform="translate(0 14)"/>

  <!-- Main "W" Wings - Aerodynamic Performance Shape -->
  <polyline points="230,340 370,710 512,500 654,710 794,340" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="96" stroke="url(#w0r_neon)"/>

  <!-- The "0" Core - Futuristic Digital Ring in the center valley -->
  <!-- Outer metallic ring of the 0 -->
  <circle cx="512" cy="460" r="92" fill="#12151b" stroke="#00E5FF" stroke-width="26" filter="url(#neon_glow)"/>
  
  <!-- Cyber tick / Speed-gauge slash through the 0 -->
  <line x1="445" y1="527" x2="579" y2="393" stroke="#00FFA3" stroke-width="16" stroke-linecap="round"/>

  <!-- Play Symbol: Small aerodynamic forward-pointing play arrow in the center of 0 -->
  <polygon points="502,434 502,486 536,460" fill="#FFFFFF"/>

  <!-- High-light top edge reflections on the W -->
  <polyline points="230,340 270,440" fill="none" stroke-linecap="round" stroke-width="72" stroke="#FFFFFF" opacity="0.35"/>
  <polyline points="794,340 754,440" fill="none" stroke-linecap="round" stroke-width="72" stroke="#FFFFFF" opacity="0.35"/>
</svg>
