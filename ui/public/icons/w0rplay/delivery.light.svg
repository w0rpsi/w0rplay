<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="face" x1="0" y1="48" x2="0" y2="975" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a44"/><stop offset="1" stop-color="#e65c00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#face)"/>
  <rect x="68" y="68" width="888" height="888" rx="196" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.25"/>
  <!-- Isometric Shipping Box / Logistics Package -->
  <g fill="#ffffff" filter="url(#shadow)" opacity="0.25" transform="translate(0, 16)">
    <polygon points="512,240 760,370 760,650 512,780 264,650 264,370" fill="#000"/>
  </g>
  <g>
    <!-- Top Face -->
    <polygon points="512,250 760,380 512,510 264,380" fill="#fff5eb"/>
    <!-- Left Face -->
    <polygon points="264,380 512,510 512,770 264,640" fill="#fbd2ac"/>
    <!-- Right Face -->
    <polygon points="512,510 760,380 760,640 512,770" fill="#e9a469"/>
    <!-- Packaging Tape -->
    <polygon points="512,250 570,280 322,410 264,380" fill="#d97724" opacity="0.8"/>
    <polygon points="512,510 570,480 570,740 512,770" fill="#c66517" opacity="0.8"/>
    <polygon points="454,480 512,510 512,770 454,740" fill="#c66517" opacity="0.8"/>
    <!-- Delivery Fast Arrow -->
    <path d="M420 590 L512 640 L604 590" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>